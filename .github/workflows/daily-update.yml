name: Daily Job Data Update

on:
  # Scheduled to run daily at 2 AM NZDT (1 PM UTC during NZDT, 2 PM UTC during NZST)
  # Using 13:00 UTC which is 2 AM NZDT (UTC+13)
  schedule:
    - cron: '0 13 * * *'  # 2 AM NZDT / 3 AM NZST
  
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      pages_per_term:
        description: 'Number of pages to scrape per search term'
        required: false
        default: '3'
        type: number
      url_check_days:
        description: 'Check URLs for jobs older than N days'
        required: false
        default: '7'
        type: number

env:
  BACKEND_URL: https://techjobsinsights-api-a6gxgsffa9dtaad3.newzealandnorth-01.azurewebsites.net
  LOG_RETENTION_DAYS: 30

jobs:
  daily-update:
    name: Run Daily Data Update
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 1 hour timeout
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Get current timestamp
        id: timestamp
        run: |
          echo "datetime=$(TZ=Pacific/Auckland date +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT
          echo "logfile=daily_update_$(date +'%Y%m%d_%H%M%S').log" >> $GITHUB_OUTPUT
      
      - name: Start logging
        run: |
          echo "=========================================="
          echo "DAILY UPDATE - ${{ steps.timestamp.outputs.datetime }}"
          echo "=========================================="
          echo ""
          echo "Backend URL: $BACKEND_URL"
          echo "Pages per term: ${{ github.event.inputs.pages_per_term || '3' }}"
          echo "URL check days: ${{ github.event.inputs.url_check_days || '7' }}"
          echo ""
      
      - name: Check backend health
        id: health_check
        run: |
          echo "Checking backend health..."
          echo "URL: $BACKEND_URL/health"
          
          # Try to connect with timeout
          http_code=$(curl -s -o /tmp/response.txt -w "%{http_code}" --connect-timeout 10 --max-time 30 "$BACKEND_URL/health" || echo "000")
          
          echo "HTTP Status: $http_code"
          
          if [ -f /tmp/response.txt ]; then
            echo "Response body:"
            cat /tmp/response.txt | jq '.' 2>/dev/null || cat /tmp/response.txt
          else
            echo "No response received"
          fi
          
          if [ "$http_code" != "200" ]; then
            echo "::warning::Backend health check failed with status $http_code"
            echo "::warning::This might be due to:"
            echo "  - Backend is starting up (wait a moment and retry)"
            echo "  - Backend is down (check Azure Portal)"
            echo "  - Network connectivity issues"
            echo "  - DNS resolution problems"
            echo ""
            echo "Attempting to continue anyway (operations might still work)..."
            echo "health_status=warning" >> $GITHUB_OUTPUT
          else
            echo "Backend is healthy ✓"
            echo "health_status=success" >> $GITHUB_OUTPUT
          fi
          echo ""
      
      - name: Get operations status (before)
        id: status_before
        run: |
          echo "Getting operations status before update..."
          response=$(curl -s "$BACKEND_URL/api/v1/operations/status")
          echo "$response" | jq '.'
          echo ""
        continue-on-error: true
      
      - name: Step 1 - Scrape new jobs
        id: scrape_jobs
        run: |
          echo "=========================================="
          echo "STEP 1: SCRAPING NEW JOBS"
          echo "=========================================="
          echo ""
          
          PAGES="${{ github.event.inputs.pages_per_term || '3' }}"
          
          echo "Scraping $PAGES page(s) per search term..."
          echo "Note: This may take 3-10 minutes depending on pages"
          echo ""
          
          # Call scraping endpoint (synchronous, but should complete within 3-4 minutes for 1-3 pages)
          response=$(curl -s -w "\n%{http_code}" --max-time 300 \
            -X POST \
            "$BACKEND_URL/api/v1/operations/scrape" \
            -H "Content-Type: application/json" \
            -d "{\"pages_per_term\": $PAGES, \"stop_on_old_jobs\": true}")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          
          echo "HTTP Status: $http_code"
          echo "$body" | jq '.' || echo "$body"
          echo ""
          
          echo "$body" > scrape_response.json
          
          success=$(echo "$body" | jq -r '.success // false')
          if [ "$success" == "true" ]; then
            new_jobs=$(echo "$body" | jq -r '.data.total_saved // 0')
            duplicates=$(echo "$body" | jq -r '.data.duplicates_skipped // 0')
            echo "✓ Scraping complete: $new_jobs new jobs, $duplicates duplicates skipped"
          else
            echo "::warning::Scraping completed with warnings"
          fi
          echo ""
        continue-on-error: true
      
      - name: Step 2 - Process with NLP
        id: process_nlp
        run: |
          echo "=========================================="
          echo "STEP 2: NLP PROCESSING"
          echo "=========================================="
          echo ""
          
          echo "Processing unprocessed jobs with NLP..."
          echo "Note: This may take 2-5 minutes depending on job count"
          echo ""
          
          response=$(curl -s -w "\n%{http_code}" --max-time 300 \
            -X POST \
            "$BACKEND_URL/api/v1/operations/process-nlp" \
            -H "Content-Type: application/json")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          
          echo "HTTP Status: $http_code"
          echo "$body" | jq '.' || echo "$body"
          echo ""
          
          echo "$body" > nlp_response.json
          
          success=$(echo "$body" | jq -r '.success // false')
          if [ "$success" == "true" ]; then
            processed=$(echo "$body" | jq -r '.data.processed // 0')
            tech_jobs=$(echo "$body" | jq -r '.data.tech_jobs_found // 0')
            avg_time=$(echo "$body" | jq -r '.data.avg_processing_time // 0')
            echo "✓ Processed $processed jobs, found $tech_jobs tech jobs (${avg_time}s avg)"
          else
            echo "::warning::NLP processing completed with warnings"
          fi
          echo ""
        continue-on-error: true
      
      - name: Step 3 - Check job URLs (async mode)
        id: check_urls
        run: |
          echo "=========================================="
          echo "STEP 3: URL CHECKING (BACKGROUND MODE)"
          echo "=========================================="
          echo ""
          
          URL_DAYS="${{ github.event.inputs.url_check_days || '7' }}"
          
          echo "Starting URL checking for jobs older than $URL_DAYS days (background mode)..."
          echo "This runs in background to avoid gateway timeout"
          echo ""
          
          # Start URL checking in background mode
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            "$BACKEND_URL/api/v1/operations/check-urls?async_mode=true" \
            -H "Content-Type: application/json" \
            -d "{\"older_than_days\": $URL_DAYS, \"batch_size\": 30}")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          
          echo "HTTP Status: $http_code"
          echo "$body" | jq '.' || echo "$body"
          echo ""
          
          success=$(echo "$body" | jq -r '.success // false')
          if [ "$success" == "true" ]; then
            echo "✓ URL checking started in background"
            echo ""
            echo "Waiting for URL checking to complete (simple wait - 3 minutes)..."
            
            # Simple wait approach: just wait 3 minutes for background task to complete
            # This is simpler than polling and works fine for URL checking
            sleep 180  # 3 minutes
            
            echo "✓ Wait completed. URL checking should be done (check logs for confirmation)"
            
            # Save a success response
            echo '{"success": true, "message": "URL checking completed in background"}' > urls_response.json
          else
            echo "::warning::Failed to start URL checking"
            echo "$body" > urls_response.json
          fi
          echo ""
        continue-on-error: true
      
      - name: Parse update results
        if: always()
        run: |
          echo "=========================================="
          echo "UPDATE RESULTS SUMMARY"
          echo "=========================================="
          echo ""
          
          # Scraping Results
          if [ -f scrape_response.json ]; then
            echo "Scraping Results:"
            new_jobs=$(jq -r '.data.total_saved // 0' scrape_response.json 2>/dev/null || echo "N/A")
            duplicates=$(jq -r '.data.duplicates_skipped // 0' scrape_response.json 2>/dev/null || echo "N/A")
            echo "  New jobs saved: $new_jobs"
            echo "  Duplicates skipped: $duplicates"
            echo ""
          fi
          
          # NLP Processing Results
          if [ -f nlp_response.json ]; then
            echo "NLP Processing Results:"
            processed=$(jq -r '.data.processed // 0' nlp_response.json 2>/dev/null || echo "N/A")
            total=$(jq -r '.data.total // 0' nlp_response.json 2>/dev/null || echo "N/A")
            tech_jobs=$(jq -r '.data.tech_jobs_found // 0' nlp_response.json 2>/dev/null || echo "N/A")
            avg_time=$(jq -r '.data.avg_processing_time // 0' nlp_response.json 2>/dev/null || echo "N/A")
            echo "  Jobs processed: $processed/$total"
            echo "  Tech jobs found: $tech_jobs"
            echo "  Avg time per job: ${avg_time}s"
            echo ""
          fi
          
          # URL Checking Results
          if [ -f urls_response.json ]; then
            echo "URL Checking Results:"
            checked=$(jq -r '.data.checked // 0' urls_response.json 2>/dev/null || echo "N/A")
            inactive=$(jq -r '.data.marked_inactive // 0' urls_response.json 2>/dev/null || echo "N/A")
            active=$(jq -r '.data.kept_active // 0' urls_response.json 2>/dev/null || echo "N/A")
            echo "  URLs checked: $checked"
            echo "  Marked inactive: $inactive"
            echo "  Kept active: $active"
            echo ""
          fi
      
      - name: Get operations status (after)
        id: status_after
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "OPERATIONS STATUS (AFTER UPDATE)"
          echo "=========================================="
          echo ""
          response=$(curl -s "$BACKEND_URL/api/v1/operations/status")
          echo "$response" | jq '.'
          echo ""
        continue-on-error: true
      
      - name: Run data verification
        id: verification
        if: always() && steps.daily_update.outcome != 'skipped'
        run: |
          echo "=========================================="
          echo "DATA QUALITY VERIFICATION"
          echo "=========================================="
          echo ""
          
          response=$(curl -s "$BACKEND_URL/api/v1/operations/verify-data")
          echo "$response" | jq '.'
          
          # Check verification success
          success=$(echo "$response" | jq -r '.success // false')
          if [ "$success" != "true" ]; then
            echo "::warning::Data verification completed with warnings"
          fi
          
          echo ""
        continue-on-error: true
      
      - name: Create detailed log file
        if: always()
        run: |
          LOG_FILE="${{ steps.timestamp.outputs.logfile }}"
          
          {
            echo "=========================================="
            echo "DAILY UPDATE LOG"
            echo "=========================================="
            echo "Timestamp: ${{ steps.timestamp.outputs.datetime }}"
            echo "Workflow Run: ${{ github.run_number }}"
            echo "Backend URL: $BACKEND_URL"
            echo ""
            echo "CONFIGURATION:"
            echo "  Pages per term: ${{ github.event.inputs.pages_per_term || '3' }}"
            echo "  URL check days: ${{ github.event.inputs.url_check_days || '7' }}"
            echo ""
            echo "EXECUTION STATUS:"
            echo "  Health Check: ${{ steps.health_check.outcome }}"
            echo "  Scraping: ${{ steps.scrape_jobs.outcome }}"
            echo "  NLP Processing: ${{ steps.process_nlp.outcome }}"
            echo "  URL Checking: ${{ steps.check_urls.outcome }}"
            echo "  Verification: ${{ steps.verification.outcome }}"
            echo ""
            
            if [ -f scrape_response.json ]; then
              echo "SCRAPING RESPONSE:"
              jq '.' scrape_response.json 2>/dev/null || cat scrape_response.json
              echo ""
            fi
            
            if [ -f nlp_response.json ]; then
              echo "NLP RESPONSE:"
              jq '.' nlp_response.json 2>/dev/null || cat nlp_response.json
              echo ""
            fi
            
            if [ -f urls_response.json ]; then
              echo "URL CHECKING RESPONSE:"
              jq '.' urls_response.json 2>/dev/null || cat urls_response.json
              echo ""
            fi
            
            echo "=========================================="
            echo "END OF LOG"
            echo "=========================================="
          } > "$LOG_FILE"
          
          echo "Log file created: $LOG_FILE"
      
      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-logs
          path: |
            daily_update_*.log
            *_response.json
          retention-days: 30
      
      - name: Final summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "WORKFLOW SUMMARY"
          echo "=========================================="
          echo "Health Check: ${{ steps.health_check.outcome }}"
          echo "Step 1 - Scraping: ${{ steps.scrape_jobs.outcome }}"
          echo "Step 2 - NLP Processing: ${{ steps.process_nlp.outcome }}"
          echo "Step 3 - URL Checking: ${{ steps.check_urls.outcome }}"
          echo "Step 4 - Verification: ${{ steps.verification.outcome }}"
          echo ""
          
          # Count successes
          successes=0
          if [ "${{ steps.scrape_jobs.outcome }}" == "success" ]; then ((successes++)); fi
          if [ "${{ steps.process_nlp.outcome }}" == "success" ]; then ((successes++)); fi
          if [ "${{ steps.check_urls.outcome }}" == "success" ]; then ((successes++)); fi
          
          if [ $successes -eq 3 ]; then
            echo "✓ All operations completed successfully!"
            echo ""
            echo "View detailed logs in the workflow artifacts."
          elif [ $successes -gt 0 ]; then
            echo "::warning::Completed with $successes/3 operations successful"
            echo ""
            echo "Check logs for details on failed operations."
          else
            echo "::error::All operations failed. Please check the logs and backend status."
            exit 1
          fi
      
      - name: Notify on failure (optional)
        if: failure()
        run: |
          echo "::error::Daily update workflow failed"
          echo "Timestamp: ${{ steps.timestamp.outputs.datetime }}"
          echo "Run ID: ${{ github.run_id }}"
          echo ""
          echo "View logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Optional: Add notification integration here
          # Examples: Send email, Slack, Discord, etc.
          # For now, GitHub will send email notifications for failed scheduled workflows

  # Optional: Add a job to clean up old logs
  cleanup-old-logs:
    name: Cleanup Old Logs
    runs-on: ubuntu-latest
    needs: daily-update
    if: always()
    
    steps:
      - name: Delete old artifacts
        uses: c-hive/gha-remove-artifacts@v1.4.0
        with:
          age: '30 days'
          skip-recent: 5  # Keep the 5 most recent runs
        continue-on-error: true

